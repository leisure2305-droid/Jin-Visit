<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仁 面会予約システム</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent-gold: #d4af37;
      --accent-amber: #f39c12;
      --text-color: #f1f1f5;
      --text-sub: #a0a0ab;
      --border-color: #2e2e38;
      --success-color: #2ecc71;
      --danger-color: #e74c3c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 40px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 500px; padding: 16px; }
    
    header { text-align: center; padding: 16px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 16px; }
    header h1 { font-size: 1.4rem; color: var(--accent-gold); font-weight: 700; letter-spacing: 1px; }
    header p { font-size: 0.8rem; color: var(--text-sub); margin-top: 4px; }
    
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 10px; background: #18181c; border: 1px solid var(--border-color); color: var(--text-sub); border-radius: 8px; font-weight: 600; cursor: pointer; text-align: center; font-size: 0.85rem; }
    .tab-btn.active { background: var(--card-bg); color: var(--accent-gold); border-color: var(--accent-gold); }

    .sync-status { text-align: center; font-size: 0.75rem; color: var(--success-color); margin-bottom: 12px; }

    .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-color); }
    .card-title { font-size: 1.05rem; font-weight: 600; color: var(--accent-gold); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 4px; }
    input[type="text"], input[type="password"], input[type="date"], input[type="time"], select, textarea {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: #18181c; color: var(--text-color); font-size: 0.95rem;
    }
    textarea { resize: vertical; min-height: 70px; }
    
    .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: opacity 0.2s; font-size: 0.95rem; }
    .btn-primary { background: linear-gradient(135deg, #d4af37, #f39c12); color: #000; margin-top: 8px; }
    .btn-secondary { background: #2e2e38; color: var(--text-color); margin-top: 8px; }
    .btn-danger { background: var(--danger-color); color: #fff; margin-top: 8px; }
    .btn:active { opacity: 0.8; }
    
    .list-item { background: #18181c; border-radius: 8px; padding: 12px; margin-bottom: 10px; border-left: 4px solid var(--accent-gold); position: relative; }
    .list-item.ng-item { border-left-color: var(--danger-color); }
    .list-item-header { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; font-size: 0.95rem; }
    .list-item-sub { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 6px; }
    .list-item-note { font-size: 0.85rem; color: #d0d0d5; background: #22222a; padding: 6px 8px; border-radius: 4px; margin-top: 6px; white-space: pre-wrap; }
    .status-tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; background: #2e2e38; color: var(--accent-gold); margin-top: 4px; }
    
    .btn-delete { position: absolute; right: 10px; bottom: 10px; background: transparent; border: none; color: var(--danger-color); font-size: 0.75rem; cursor: pointer; }

    .hidden { display: none !important; }
    .error-msg { color: var(--danger-color); font-size: 0.8rem; margin-top: 6px; text-align: center; }
  </style>

  <!-- Firebase SDK Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBaGgZtwTg24_YFZDrO6prkA9ZdtDogk",
      authDomain: "jin-visit.firebaseapp.com",
      projectId: "jin-visit",
      storageBucket: "jin-visit.firebasestorage.app",
      messagingSenderId: "868007153612",
      appId: "1:868007153612:web:72d4ba0811fbbd57391769",
      measurementId: "G-6ZE737LYWE"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // タブ切り替え
    const tabGuest = document.getElementById('tabGuest');
    const tabAdmin = document.getElementById('tabAdmin');
    const viewGuest = document.getElementById('viewGuest');
    const viewAdmin = document.getElementById('viewAdmin');
    const adminAuthSection = document.getElementById('adminAuthSection');
    const adminContentSection = document.getElementById('adminContentSection');

    let isAdminLoggedIn = false;

    tabGuest.addEventListener('click', () => {
      tabGuest.classList.add('active');
      tabAdmin.classList.remove('active');
      viewGuest.classList.remove('hidden');
      viewAdmin.classList.add('hidden');
    });

    tabAdmin.addEventListener('click', () => {
      tabAdmin.classList.add('active');
      tabGuest.classList.remove('active');
      viewAdmin.classList.remove('hidden');
      viewGuest.classList.add('hidden');
      checkAdminStatus();
    });

    // 管理者認証チェック
    async function checkAdminStatus() {
      if (isAdminLoggedIn) {
        adminAuthSection.classList.add('hidden');
        adminContentSection.classList.remove('hidden');
        return;
      }
      
      const docRef = doc(db, "settings", "auth");
      const docSnap = await getDoc(docRef);
      if (!docSnap.exists()) {
        document.getElementById('adminAuthTitle').innerText = "⚙️ 初回管理者パスワード設定";
        document.getElementById('adminPassConfirmGroup').classList.remove('hidden');
        document.getElementById('adminAuthBtn').innerText = "パスワードを登録してログイン";
      } else {
        document.getElementById('adminAuthTitle').innerText = "🔒 仁専用ログイン";
        document.getElementById('adminPassConfirmGroup').classList.add('hidden');
        document.getElementById('adminAuthBtn').innerText = "ログイン";
      }
    }

    // パスワード送信処理
    document.getElementById('adminAuthForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pass = document.getElementById('adminPassInput').value;
      const errorEl = document.getElementById('adminAuthError');
      errorEl.innerText = '';

      const docRef = doc(db, "settings", "auth");
      const docSnap = await getDoc(docRef);

      if (!docSnap.exists()) {
        const passConfirm = document.getElementById('adminPassConfirmInput').value;
        if (pass.length < 4) {
          errorEl.innerText = "パスワードは4文字以上にしてください。";
          return;
        }
        if (pass !== passConfirm) {
          errorEl.innerText = "パスワードが一致しません。";
          return;
        }
        await setDoc(docRef, { password: pass });
        alert("管理者パスワードを設定しました。");
        isAdminLoggedIn = true;
        adminAuthSection.classList.add('hidden');
        adminContentSection.classList.remove('hidden');
      } else {
        if (docSnap.data().password === pass) {
          isAdminLoggedIn = true;
          adminAuthSection.classList.add('hidden');
          adminContentSection.classList.remove('hidden');
        } else {
          errorEl.innerText = "パスワードが正しくありません。";
        }
      }
    });

    // ログアウト
    document.getElementById('btnLogout').addEventListener('click', () => {
      isAdminLoggedIn = false;
      document.getElementById('adminPassInput').value = '';
      adminAuthSection.classList.remove('hidden');
      adminContentSection.classList.add('hidden');
    });

    // --- データ連携 (Firestore) ---

    // 1. 面会予約 (ゲスト側)
    document.getElementById('guestReservationForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const visitor = document.getElementById('resVisitor').value;
      const date = document.getElementById('resDate').value;
      const time = document.getElementById('resTime').value;
      const note = document.getElementById('resNote').value;

      try {
        await addDoc(collection(db, "reservations"), {
          visitor, date, time, note, createdAt: new Date()
        });
        alert("面会予約を送信しました！");
        document.getElementById('guestReservationForm').reset();
      } catch (err) {
        alert("予約の送信に失敗しました: " + err.message);
      }
    });

    // 面会予定リスト（ゲスト・管理者共有表示）
    const qReservations = query(collection(db, "reservations"), orderBy("date", "asc"));
    onSnapshot(qReservations, (snapshot) => {
      const gList = document.getElementById('guestReservationList');
      const aList = document.getElementById('adminReservationList');
      gList.innerHTML = '';
      aList.innerHTML = '';

      if (snapshot.empty) {
        gList.innerHTML = '<p style="font-size:0.8rem; color:var(--text-sub); text-align:center;">予定された面会はありません</p>';
        aList.innerHTML = '<p style="font-size:0.8rem; color:var(--text-sub); text-align:center;">予定された面会はありません</p>';
        return;
      }

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const id = docSnap.id;

        // ゲスト用画面
        const gItem = document.createElement('div');
        gItem.className = 'list-item';
        gItem.innerHTML = `
          <div class="list-item-header">
            <span>📅 ${data.date} ${data.time}</span>
            <span>👤 ${data.visitor}</span>
          </div>
          ${data.note ? `<div class="list-item-note">${data.note}</div>` : ''}
        `;
        gList.appendChild(gItem);

        // 管理者用画面（削除ボタン付）
        const aItem = document.createElement('div');
        aItem.className = 'list-item';
        aItem.innerHTML = `
          <div class="list-item-header">
            <span>📅 ${data.date} ${data.time}</span>
            <span>👤 ${data.visitor}</span>
          </div>
          ${data.note ? `<div class="list-item-note">${data.note}</div>` : ''}
          <button class="btn-delete" onclick="deleteData('reservations', '${id}')">削除</button>
        `;
        aList.appendChild(aItem);
      });
    });

    // 2. NG日時管理 (仁さん側)
    document.getElementById('ngForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const date = document.getElementById('ngDate').value;
      const note = document.getElementById('ngNote').value;

      try {
        await addDoc(collection(db, "ng_dates"), { date, note, createdAt: new Date() });
        document.getElementById('ngForm').reset();
      } catch (err) {
        alert("NG日時の保存に失敗しました: " + err.message);
      }
    });

    const qNg = query(collection(db, "ng_dates"), orderBy("date", "asc"));
    onSnapshot(qNg, (snapshot) => {
      const gList = document.getElementById('guestNgList');
      const aList = document.getElementById('adminNgList');
      gList.innerHTML = '';
      aList.innerHTML = '';

      if (snapshot.empty) {
        gList.innerHTML = '<p style="font-size:0.8rem; color:var(--text-sub); text-align:center;">面会不可の予定はありません</p>';
        aList.innerHTML = '<p style="font-size:0.8rem; color:var(--text-sub); text-align:center;">登録されたNG日はありません</p>';
        return;
      }

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const id = docSnap.id;

        const gItem = document.createElement('div');
        gItem.className = 'list-item ng-item';
        gItem.innerHTML = `
          <div class="list-item-header">
            <span>⛔ ${data.date}</span>
          </div>
          ${data.note ? `<div class="list-item-note">${data.note}</div>` : ''}
        `;
        gList.appendChild(gItem);

        const aItem = document.createElement('div');
        aItem.className = 'list-item ng-item';
        aItem.innerHTML = `
          <div class="list-item-header">
            <span>⛔ ${data.date}</span>
          </div>
          ${data.note ? `<div class="list-item-note">${data.note}</div>` : ''}
          <button class="btn-delete" onclick="deleteData('ng_dates', '${id}')">削除</button>
        `;
        aList.appendChild(aItem);
      });
    });

    // 3. 差し入れ・お土産・お返し管理 (仁さん側)
    document.getElementById('giftForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const item = document.getElementById('giftItem').value;
      const from = document.getElementById('giftFrom').value;
      const returnStatus = document.getElementById('giftReturn').value;
      const note = document.getElementById('giftNote').value;

      try {
        await addDoc(collection(db, "gifts"), {
          item, from, returnStatus, note, createdAt: new Date()
        });
        document.getElementById('giftForm').reset();
      } catch (err) {
        alert("記録に失敗しました: " + err.message);
      }
    });

    const qGifts = query(collection(db, "gifts"), orderBy("createdAt", "desc"));
    onSnapshot(qGifts, (snapshot) => {
      const list = document.getElementById('adminGiftList');
      list.innerHTML = '';

      if (snapshot.empty) {
        list.innerHTML = '<p style="font-size:0.8rem; color:var(--text-sub); text-align:center;">記録はありません</p>';
        return;
      }

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const id = docSnap.id;
        const item = document.createElement('div');
        item.className = 'list-item';
        item.style.borderLeftColor = 'var(--accent-amber)';
        item.innerHTML = `
          <div class="list-item-header">
            <span>🎁 ${data.item}</span>
            <span style="font-size:0.8rem; color:var(--text-sub);">持参: ${data.from}</span>
          </div>
          <div class="status-tag">お返し: ${data.returnStatus}</div>
          ${data.note ? `<div class="list-item-note">${data.note}</div>` : ''}
          <button class="btn-delete" onclick="deleteData('gifts', '${id}')">削除</button>
        `;
        list.appendChild(item);
      });
    });

    // 削除処理のグローバル登録
    window.deleteData = async (colName, id) => {
      if (confirm('この記録を削除しますか？')) {
        await deleteDoc(doc(db, colName, id));
      }
    };
  </script>
</head>
<body>
  <div class="container">
    <header>
      <h1>仁 面会予約＆管理</h1>
      <p>スケジュール調整・面会サポート</p>
    </header>

    <div class="sync-status">● リアルタイム自動同期中</div>

    <!-- ナビゲーションタブ -->
    <div class="nav-tabs">
      <button id="tabGuest" class="tab-btn active">📅 面会予約（ご友人用）</button>
      <button id="tabAdmin" class="tab-btn">🔒 仁専用管理ページ</button>
    </div>

    <!-- ================= 1. 友人・面会者用画面 ================= -->
    <div id="viewGuest">
      <!-- 予約フォーム -->
      <div class="card">
        <div class="card-title">📅 面会を予約する</div>
        <form id="guestReservationForm">
          <div class="form-group">
            <label>お名前</label>
            <input type="text" id="resVisitor" placeholder="例: 山田 太郎" required>
          </div>
          <div class="form-group">
            <label>希望日</label>
            <input type="date" id="resDate" required>
          </div>
          <div class="form-group">
            <label>希望時間</label>
            <input type="time" id="resTime" required>
          </div>
          <div class="form-group">
            <label>メモ・伝言</label>
            <textarea id="resNote" placeholder="面会人数や連絡事項など"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">面会を予約する</button>
        </form>
      </div>

      <!-- 面会不可（NG）日時一覧 -->
      <div class="card">
        <div class="card-title">⛔ 面会不可（NG）の日時</div>
        <div id="guestNgList"></div>
      </div>

      <!-- 予約済み一覧 -->
      <div class="card">
        <div class="card-title">📋 現在の面会予定</div>
        <div id="guestReservationList"></div>
      </div>
    </div>

    <!-- ================= 2. 仁専用管理画面 ================= -->
    <div id="viewAdmin" class="hidden">
      <!-- パスワード認証画面 -->
      <div id="adminAuthSection" class="card">
        <div id="adminAuthTitle" class="card-title">🔒 仁専用ログイン</div>
        <form id="adminAuthForm">
          <div class="form-group">
            <label>パスワード</label>
            <input type="password" id="adminPassInput" placeholder="パスワードを入力" required>
          </div>
          <div class="form-group hidden" id="adminPassConfirmGroup">
            <label>確認用パスワード</label>
            <input type="password" id="adminPassConfirmInput" placeholder="もう一度入力">
          </div>
          <div id="adminAuthError" class="error-msg"></div>
          <button type="submit" id="adminAuthBtn" class="btn btn-primary">ログイン</button>
        </form>
      </div>

      <!-- 管理者コンテンツ画面（認証後に表示） -->
      <div id="adminContentSection" class="hidden">
        <!-- 面会不可（NG）設定 -->
        <div class="card">
          <div class="card-title">⛔ 面会不可（NG）日時を追加</div>
          <form id="ngForm">
            <div class="form-group">
              <label>日付</label>
              <input type="date" id="ngDate" required>
            </div>
            <div class="form-group">
              <label>理由・メモ</label>
              <input type="text" id="ngNote" placeholder="例: リハビリ、検査等">
            </div>
            <button type="submit" class="btn btn-primary">NG日時を追加</button>
          </form>
          <div style="margin-top: 16px;">
            <div style="font-size:0.85rem; font-weight:600; margin-bottom:8px; color:var(--accent-gold);">登録済みNG日</div>
            <div id="adminNgList"></div>
          </div>
        </div>

        <!-- 差し入れ・お土産・お返し管理 -->
        <div class="card">
          <div class="card-title">🎁 差し入れ・お土産・お返し管理</div>
          <form id="giftForm" style="margin-bottom: 16px;">
            <div class="form-group">
              <label>品名・内容</label>
              <input type="text" id="giftItem" placeholder="例: フルーツ、タオル" required>
            </div>
            <div class="form-group">
              <label>持ってきた人</label>
              <input type="text" id="giftFrom" placeholder="例: 山田 太郎" required>
            </div>
            <div class="form-group">
              <label>お返し状況</label>
              <select id="giftReturn">
                <option value="未">未（これから）</option>
                <option value="不要">不要</option>
                <option value="完了">完了</option>
              </select>
            </div>
            <div class="form-group">
              <label>メモ</label>
              <input type="text" id="giftNote" placeholder="数量や注意点など">
            </div>
            <button type="submit" class="btn btn-primary" style="background: linear-gradient(135deg, #f39c12, #d4af37);">記録を追加</button>
          </form>
          <div id="adminGiftList"></div>
        </div>

        <!-- 予約状況管理 -->
        <div class="card">
          <div class="card-title">📋 全予約の管理</div>
          <div id="adminReservationList"></div>
        </div>

        <!-- ログアウトボタン -->
        <button id="btnLogout" class="btn btn-secondary">ログアウト</button>
      </div>
    </div>
  </div>
</body>
</html>

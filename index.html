<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仁専用面会予約</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent-gold: #d4af37;
            --accent-amber: #f39c12;
            --text-color: #f1f1f5;
            --text-sub: #a0a0ab;
            --border-color: #2e2e38;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 40px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; padding: 16px; }

        header { text-align: center; padding: 16px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 16px; }
        header h1 { font-size: 1.4rem; color: var(--accent-gold); font-weight: 700; letter-spacing: 1px; }
        header p { font-size: 0.8rem; color: var(--text-sub); margin-top: 4px; }

        .role-switch { display: flex; background: var(--card-bg); border-radius: 8px; padding: 4px; margin-bottom: 16px; border: 1px solid var(--border-color); }
        .role-btn { flex: 1; padding: 10px 0; background: none; border: none; color: var(--text-sub); font-size: 0.85rem; cursor: pointer; border-radius: 6px; font-weight: 600; }
        .role-btn.active { background: #2a2a35; color: var(--accent-gold); box-shadow: 0 2px 6px rgba(0,0,0,0.3); }

        .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-color); }
        .card-title { font-size: 1rem; color: var(--accent-gold); margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; font-weight: 700; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 4px; }

        input, select, textarea { 
            width: 100%; padding: 12px; background: #121214; border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-color); font-size: 0.95rem; 
        }
        select { color: var(--accent-gold); font-weight: bold; background: #16161a; border-color: var(--accent-gold); }
        input:focus, select:focus { border-color: var(--accent-gold); outline: none; }

        .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--accent-gold), var(--accent-amber)); border: none; border-radius: 8px; color: #121214; font-weight: 700; font-size: 0.95rem; cursor: pointer; }

        .slot-list { display: flex; flex-direction: column; gap: 8px; }
        .slot-card { background: #16161a; padding: 12px; border-radius: 8px; border-left: 4px solid var(--accent-gold); display: flex; justify-content: space-between; align-items: center; }
        .slot-card.ng { border-left-color: var(--danger-color); opacity: 0.7; }
        .slot-card.booked { border-left-color: var(--text-sub); opacity: 0.7; }
        
        .slot-time { font-size: 0.95rem; font-weight: bold; }
        .status-tag { font-size: 0.9rem; font-weight: bold; padding: 4px 12px; border-radius: 4px; }
        .status-ng { color: var(--danger-color); }
        .status-booked { color: var(--text-sub); }

        .btn-reserve { padding: 6px 14px; background: var(--accent-gold); color: #121214; border: none; border-radius: 4px; font-weight: bold; font-size: 0.85rem; cursor: pointer; }
        .btn-toggle-ng { padding: 6px 10px; background: #2a2a35; color: var(--text-color); border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.75rem; cursor: pointer; }

        .gift-item { background: #16161a; padding: 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border-color); position: relative; }
        .gift-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--accent-gold); font-weight: bold; padding-right: 45px; }
        .btn-delete { position: absolute; top: 10px; right: 10px; background: none; border: 1px solid var(--danger-color); color: var(--danger-color); padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; }
        .status-badge { display: inline-block; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; margin-top: 6px; background: #2a2a35; }
        .status-badge.done { background: rgba(46, 204, 113, 0.2); color: var(--success-color); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 16px; z-index: 100; }
        .modal-content { background: var(--card-bg); padding: 18px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid var(--accent-gold); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 id="header-title">仁専用面会予約</h1>
        <p id="header-sub">VISIT RESERVATION</p>
    </header>

    <!-- モード切り替え -->
    <div class="role-switch">
        <button class="role-btn active" id="btn-guest-tab" onclick="switchTab('guest')">お友達用画面（予約）</button>
        <button class="role-btn" id="btn-host-tab" onclick="switchTab('host')">🔒 仁さん用画面（管理）</button>
    </div>

    <!-- お友達用画面 -->
    <div id="guest-view">
        <div class="card">
            <div class="card-title">📅 面会希望日の選択</div>
            <div class="form-group">
                <label>プルダウンから日付を選択してください（8月・9月）</label>
                <select id="visit-date-select" onchange="loadSlots()"></select>
            </div>
        </div>

        <div class="card">
            <div class="card-title">⏰ 時間枠一覧（1時間単位）</div>
            <div class="slot-list" id="slot-container"></div>
        </div>
    </div>

    <!-- 仁さん用画面（管理画面） -->
    <div id="host-view" style="display:none;">
        <!-- パスワード変更枠 -->
        <div class="card">
            <div class="card-title">🔑 暗証番号（パスワード）設定</div>
            <form id="change-pin-form" style="display:flex; gap:8px;">
                <input type="password" id="new-pin" placeholder="新しい暗証番号を入力" required style="flex:1;">
                <button type="submit" style="padding:10px 16px; background:var(--accent-gold); border:none; border-radius:8px; font-weight:bold; cursor:pointer;">変更</button>
            </form>
        </div>

        <div class="card">
            <div class="card-title">⚙️ 面会NG設定・検査予定</div>
            <div class="form-group">
                <label>設定する日付を選択してください</label>
                <select id="host-date-select" onchange="renderHostSlots()"></select>
            </div>
            <p style="font-size:0.8rem; color:var(--text-sub); margin-bottom:10px;">検査やリハビリで面会できない時間帯は「NGにする」をタップしてください。</p>
            <div class="slot-list" id="host-slot-container"></div>
        </div>

        <div class="card">
            <div class="card-title">🎁 差し入れの新規登録</div>
            <form id="gift-form">
                <div class="form-group">
                    <label>くれた人の名前</label>
                    <input type="text" id="gift-sender" placeholder="例：山田 太郎" required>
                </div>
                <div class="form-group">
                    <label>もらった物</label>
                    <input type="text" id="gift-item" placeholder="例：高級缶詰セット" required>
                </div>
                <div class="form-group">
                    <label>日付</label>
                    <input type="date" id="gift-date" required>
                </div>
                <div class="form-group">
                    <label>お礼・内祝いステータス</label>
                    <select id="gift-status" style="color:var(--text-color); border-color:var(--border-color); background:#121214;">
                        <option value="未対応">未対応</option>
                        <option value="内祝い発送済み">内祝い発送済み</option>
                        <option value="内祝いなし（お礼完了）">内祝いなし（お礼完了）</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>お礼メモ（いつ・何でお返ししたか）</label>
                    <input type="text" id="gift-return-memo" placeholder="例：8/20 LINEでお礼送信">
                </div>
                <button type="submit" class="btn">記録を保存</button>
            </form>
        </div>

        <div class="card">
            <div class="card-title">📋 差し入れ一覧</div>
            <div id="gift-list"></div>
        </div>
    </div>
</div>

<!-- パスワード認証モーダル -->
<div class="modal" id="auth-modal">
    <div class="modal-content">
        <h3 style="color:var(--accent-gold); font-size:1rem; margin-bottom:8px;">🔒 仁さん専用 ログイン</h3>
        <p style="font-size:0.8rem; color:var(--text-sub); margin-bottom:12px;">管理画面を開くには暗証番号を入力してください。</p>
        <form id="auth-form">
            <div class="form-group">
                <input type="password" id="pin-code" placeholder="暗証番号を入力（初期: 1234）" required style="text-align:center; font-size:1.2rem; letter-spacing:4px;">
            </div>
            <button type="submit" class="btn">認証して進む</button>
            <div style="display:flex; justify-content:space-between; margin-top:12px;">
                <button type="button" onclick="resetPin()" style="background:none; border:none; color:var(--danger-color); cursor:pointer; font-size:0.75rem;">パスワードを忘れた場合</button>
                <button type="button" onclick="closeAuthModal()" style="background:none; border:none; color:var(--text-sub); cursor:pointer; font-size:0.8rem;">キャンセル</button>
            </div>
        </form>
    </div>
</div>

<!-- 予約入力モーダル -->
<div class="modal" id="booking-modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <h3 style="color:var(--accent-gold); font-size:1rem;" id="modal-time-title">面会予約</h3>
            <span style="cursor:pointer; font-size:1.2rem; color:var(--text-sub);" onclick="closeBookingModal()">✕</span>
        </div>
        <form id="booking-form">
            <div class="form-group">
                <label>代表者お名前（必須）</label>
                <input type="text" id="rep-name" required placeholder="お名前を入力">
            </div>
            <div class="form-group">
                <label>面会人数</label>
                <select id="visitor-count" onchange="toggleMemberInputs()" style="color:var(--text-color); border-color:var(--border-color); background:#121214;">
                    <option value="1">1名</option>
                    <option value="2">2名</option>
                    <option value="3">3名</option>
                    <option value="4">4名</option>
                </select>
            </div>
            <div id="member-inputs">
                <div class="form-group member-field" id="m1" style="display:none;"><label>同行者1 お名前</label><input type="text" class="member-name"></div>
                <div class="form-group member-field" id="m2" style="display:none;"><label>同行者2 お名前</label><input type="text" class="member-name"></div>
                <div class="form-group member-field" id="m3" style="display:none;"><label>同行者3 お名前</label><input type="text" class="member-name"></div>
            </div>
            <button type="submit" class="btn">予約を確定する</button>
        </form>
    </div>
</div>

<script>
    let currentPIN = "1234"; // 初期暗証番号
    let isAuthenticated = false;
    let currentRole = 'guest';
    let selectedSlotTime = '';

    let slotData = {};
    let gifts = [];

    // 8月〜9月の日付プルダウン自動生成
    function initDateSelects() {
        const guestSelect = document.getElementById('visit-date-select');
        const hostSelect = document.getElementById('host-date-select');
        guestSelect.innerHTML = '';
        hostSelect.innerHTML = '';
        
        const days = ['日', '月', '火', '水', '木', '金', '土'];

        // 2026年8月17日〜2026年9月30日
        let start = new Date(2026, 7, 17);
        let end = new Date(2026, 8, 30);

        for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const date = String(d.getDate()).padStart(2, '0');
            const dayName = days[d.getDay()];
            
            const dateStr = `${year}-${month}-${date}`;
            const labelStr = `${parseInt(month)}月${parseInt(date)}日 (${dayName})`;

            const optGuest = document.createElement('option');
            optGuest.value = dateStr;
            optGuest.text = labelStr;
            guestSelect.appendChild(optGuest);

            const optHost = document.createElement('option');
            optHost.value = dateStr;
            optHost.text = labelStr;
            hostSelect.appendChild(optHost);
        }
    }

    function switchTab(role) {
        if (role === 'host' && !isAuthenticated) {
            document.getElementById('auth-modal').style.display = 'flex';
            document.getElementById('pin-code').focus();
            return;
        }

        currentRole = role;
        document.getElementById('btn-guest-tab').classList.toggle('active', role === 'guest');
        document.getElementById('btn-host-tab').classList.toggle('active', role === 'host');

        document.getElementById('guest-view').style.display = (role === 'guest') ? 'block' : 'none';
        document.getElementById('host-view').style.display = (role === 'host') ? 'block' : 'none';

        // ヘッダータイトルの切り替え
        if (role === 'host') {
            document.getElementById('header-title').innerText = "仁専用面会予約（管理）";
            document.getElementById('header-sub').innerText = "VISIT & GIFT MANAGEMENT";
            document.getElementById('host-date-select').value = document.getElementById('visit-date-select').value;
            renderHostSlots();
        } else {
            document.getElementById('header-title').innerText = "仁専用面会予約";
            document.getElementById('header-sub').innerText = "VISIT RESERVATION";
            loadSlots();
        }
    }

    function closeAuthModal() {
        document.getElementById('auth-modal').style.display = 'none';
        document.getElementById('pin-code').value = '';
    }

    document.getElementById('auth-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const inputPin = document.getElementById('pin-code').value;
        if (inputPin === currentPIN) {
            isAuthenticated = true;
            closeAuthModal();
            switchTab('host');
        } else {
            alert('暗証番号が違います');
            document.getElementById('pin-code').value = '';
        }
    });

    document.getElementById('change-pin-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const newPin = document.getElementById('new-pin').value;
        if(newPin.trim().length > 0) {
            currentPIN = newPin.trim();
            alert(`暗証番号を「${currentPIN}」に変更しました！`);
            document.getElementById('new-pin').value = '';
        }
    });

    function resetPin() {
        if(confirm('暗証番号を初期設定「1234」にリセットしますか？')) {
            currentPIN = "1234";
            alert('暗証番号を「1234」にリセットしました。');
            document.getElementById('pin-code').value = '';
        }
    }

    function isWeekend(dateStr) {
        const date = new Date(dateStr);
        const day = date.getDay();
        return day === 0 || day === 6;
    }

    function loadSlots() {
        const dateVal = document.getElementById('visit-date-select').value;
        const container = document.getElementById('slot-container');
        container.innerHTML = '';

        const weekend = isWeekend(dateVal);
        const startHour = weekend ? 12 : 14;
        const endHour = 20;

        for (let h = startHour; h < endHour; h++) {
            const timeStr = `${String(h).padStart(2, '0')}:00 - ${String(h+1).padStart(2, '0')}:00`;
            const key = `${dateVal}_${timeStr}`;
            
            if(!slotData[key]) {
                slotData[key] = { ng: false, booked: false, name: '' };
            }

            const slot = slotData[key];
            const card = document.createElement('div');

            if(slot.ng) {
                card.className = 'slot-card ng';
                card.innerHTML = `
                    <div class="slot-time">${timeStr}</div>
                    <span class="status-tag status-ng">NG</span>
                `;
            } else if(slot.booked) {
                card.className = 'slot-card booked';
                card.innerHTML = `
                    <div class="slot-time">${timeStr}</div>
                    <span class="status-tag status-booked">×</span>
                `;
            } else {
                card.className = 'slot-card';
                card.innerHTML = `
                    <div class="slot-time">${timeStr}</div>
                    <button class="btn-reserve" onclick="openBookingModal('${timeStr}')">予約する</button>
                `;
            }
            container.appendChild(card);
        }
    }

    function renderHostSlots() {
        const dateVal = document.getElementById('host-date-select').value;
        const container = document.getElementById('host-slot-container');
        container.innerHTML = '';

        const weekend = isWeekend(dateVal);
        const startHour = weekend ? 12 : 14;
        const endHour = 20;

        for (let h = startHour; h < endHour; h++) {
            const timeStr = `${String(h).padStart(2, '0')}:00 - ${String(h+1).padStart(2, '0')}:00`;
            const key = `${dateVal}_${timeStr}`;
            
            if(!slotData[key]) slotData[key] = { ng: false, booked: false, name: '' };
            const slot = slotData[key];

            const card = document.createElement('div');
            card.className = 'slot-card';
            card.innerHTML = `
                <div>
                    <div class="slot-time">${timeStr}</div>
                    <div style="font-size:0.75rem; color:var(--text-sub);">
                        ${slot.booked ? `予約あり: ${slot.name} 様` : (slot.ng ? '設定: 面会不可(NG)' : '状態: 空き枠')}
                    </div>
                </div>
                <button class="btn-toggle-ng" onclick="toggleNG('${key}')">
                    ${slot.ng ? 'NG解除' : 'NGにする'}
                </button>
            `;
            container.appendChild(card);
        }
    }

    function toggleNG(key) {
        if(slotData[key]) {
            slotData[key].ng = !slotData[key].ng;
            renderHostSlots();
            loadSlots();
        }
    }

    function toggleMemberInputs() {
        const count = parseInt(document.getElementById('visitor-count').value);
        for(let i = 1; i <= 3; i++) {
            document.getElementById(`m${i}`).style.display = (i < count) ? 'block' : 'none';
        }
    }

    function openBookingModal(timeStr) {
        selectedSlotTime = timeStr;
        document.getElementById('modal-time-title').innerText = `${timeStr} の予約`;
        document.getElementById('booking-modal').style.display = 'flex';
    }

    function closeBookingModal() {
        document.getElementById('booking-modal').style.display = 'none';
    }

    document.getElementById('booking-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const dateVal = document.getElementById('visit-date-select').value;
        const key = `${dateVal}_${selectedSlotTime}`;
        const name = document.getElementById('rep-name').value;
        
        if(slotData[key]) {
            slotData[key].booked = true;
            slotData[key].name = name;
        }
        alert('予約が完了しました！');
        closeBookingModal();
        document.getElementById('booking-form').reset();
        loadSlots();
    });

    document.getElementById('gift-form').addEventListener('submit', (e) => {
        e.preventDefault();
        gifts.unshift({
            id: Date.now(),
            sender: document.getElementById('gift-sender').value,
            item: document.getElementById('gift-item').value,
            date: document.getElementById('gift-date').value,
            status: document.getElementById('gift-status').value,
            memo: document.getElementById('gift-return-memo').value
        });
        document.getElementById('gift-form').reset();
        renderGifts();
    });

    function deleteGift(id) {
        if(confirm('この差し入れメモを削除しますか？')) {
            gifts = gifts.filter(g => g.id !== id);
            renderGifts();
        }
    }

    function renderGifts() {
        const container = document.getElementById('gift-list');
        container.innerHTML = '';
        if(gifts.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:var(--text-sub); font-size:0.85rem; padding:12px;">登録された差し入れはありません</div>';
            return;
        }
        gifts.forEach(g => {
            const isDone = g.status !== '未対応';
            container.innerHTML += `
                <div class="gift-item">
                    <button class="btn-delete" onclick="deleteGift(${g.id})">🗑 削除</button>
                    <div class="gift-header"><span>${g.sender} 様</span><span>${g.date}</span></div>
                    <div style="font-size:0.9rem; margin:4px 0;">🎁 ${g.item}</div>
                    <span class="status-badge ${isDone ? 'done' : ''}">${g.status}</span>
                    ${g.memo ? `<div style="font-size:0.75rem; color:var(--text-sub); margin-top:4px;">📝 ${g.memo}</div>` : ''}
                </div>
            `;
        });
    }

    // 初期化実行
    initDateSelects();
    document.getElementById('gift-date').valueAsDate = new Date();
    loadSlots();
    renderGifts();
</script>

</body>
</html>

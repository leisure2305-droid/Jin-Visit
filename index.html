<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仁 面会予約システム</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent-gold: #d4af37;
      --accent-amber: #f39c12;
      --text-color: #f1f1f5;
      --text-sub: #a0a0ab;
      --border-color: #2e2e38;
      --success-color: #2ecc71;
      --danger-color: #e74c3c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 40px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 500px; padding: 16px; }
    
    header { text-align: center; padding: 16px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 16px; }
    header h1 { font-size: 1.4rem; color: var(--accent-gold); font-weight: 700; letter-spacing: 1px; }
    header p { font-size: 0.8rem; color: var(--text-sub); margin-top: 4px; }
    
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 10px; background: #18181c; border: 1px solid var(--border-color); color: var(--text-sub); border-radius: 8px; font-weight: 600; cursor: pointer; text-align: center; font-size: 0.85rem; }
    .tab-btn.active { background: var(--card-bg); color: var(--accent-gold); border-color: var(--accent-gold); }

    .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-color); }
    .card-title { font-size: 1.05rem; font-weight: 600; color: var(--accent-gold); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 4px; }
    input[type="text"], input[type="password"], input[type="date"], select, textarea {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: #18181c; color: var(--text-color); font-size: 0.95rem;
    }
    
    .visitor-input-container { background: #16161a; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 12px; }
    .visitor-field { margin-bottom: 8px; }
    .visitor-field:last-child { margin-bottom: 0; }
    .visitor-field label { font-size: 0.75rem; color: var(--accent-gold); }

    .time-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
    .time-btn { padding: 10px; background: #18181c; border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-color); font-size: 0.8rem; cursor: pointer; text-align: center; }
    .time-btn.selected { border-color: var(--accent-gold); background: rgba(212, 175, 55, 0.15); color: var(--accent-gold); font-weight: bold; }
    .time-btn.disabled { opacity: 0.4; cursor: not-allowed; border-color: #333; background: #121214; color: #888; }

    .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: opacity 0.2s; font-size: 0.95rem; }
    .btn-primary { background: linear-gradient(135deg, #d4af37, #f39c12); color: #000; margin-top: 8px; }
    .btn-secondary { background: #2e2e38; color: var(--text-color); margin-top: 8px; }
    .btn-danger { background: var(--danger-color); color: #fff; margin-top: 8px; }
    
    .list-item { background: #18181c; border-radius: 8px; padding: 12px; margin-bottom: 10px; border-left: 4px solid var(--accent-gold); position: relative; }
    .list-item.ng-item { border-left-color: var(--danger-color); }
    .list-item-header { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; font-size: 0.95rem; }
    .list-item-note { font-size: 0.85rem; color: #d0d0d5; background: #22222a; padding: 6px 8px; border-radius: 4px; margin-top: 6px; }
    .btn-delete { position: absolute; right: 10px; bottom: 10px; background: transparent; border: none; color: var(--danger-color); font-size: 0.75rem; cursor: pointer; }

    .hidden { display: none !important; }
    .error-msg { color: var(--danger-color); font-size: 0.8rem; margin-top: 6px; text-align: center; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBaGgZtwTg24_YFZDrO6prkA9ZdtDogk",
      authDomain: "jin-visit.firebaseapp.com",
      projectId: "jin-visit",
      storageBucket: "jin-visit.firebasestorage.app",
      messagingSenderId: "868007153612",
      appId: "1:868007153612:web:72d4ba0811fbbd57391769",
      measurementId: "G-6ZE737LYWE"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let reservationsData = [];
    let ngData = [];
    let selectedTime = null;

    // タブ切り替え
    const tabGuest = document.getElementById('tabGuest');
    const tabAdmin = document.getElementById('tabAdmin');
    const viewGuest = document.getElementById('viewGuest');
    const viewAdmin = document.getElementById('viewAdmin');

    tabGuest.addEventListener('click', () => {
      tabGuest.classList.add('active');
      tabAdmin.classList.remove('active');
      viewGuest.classList.remove('hidden');
      viewAdmin.classList.add('hidden');
    });

    tabAdmin.addEventListener('click', () => {
      tabAdmin.classList.add('active');
      tabGuest.classList.remove('active');
      viewAdmin.classList.remove('hidden');
      viewGuest.classList.add('hidden');
    });

    // 仁専用ログイン処理
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pass = document.getElementById('adminPassInput').value;
      const errorEl = document.getElementById('adminAuthError');
      errorEl.innerText = '';

      const docRef = doc(db, "settings", "auth");
      const docSnap = await getDoc(docRef);
      const currentPass = docSnap.exists() ? docSnap.data().password : "jin1234";

      if (pass === currentPass) {
        document.getElementById('adminAuthSection').classList.add('hidden');
        document.getElementById('adminContentSection').classList.remove('hidden');
      } else {
        errorEl.innerText = "パスワードが正しくありません。";
      }
    });

    // パスワード変更
    document.getElementById('changePassForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPass = document.getElementById('newPassInput').value;
      if (newPass.length < 4) {
        alert("パスワードは4文字以上で設定してください。");
        return;
      }
      await setDoc(doc(db, "settings", "auth"), { password: newPass });
      alert("パスワードを変更しました。次回から新しいパスワードでログインしてください。");
      document.getElementById('newPassInput').value = '';
    });

    // パスワードリセット
    document.getElementById('btnResetPass').addEventListener('click', async () => {
      if (confirm('パスワードを初期パスワード ( jin1234 ) にリセットしますか？')) {
        await setDoc(doc(db, "settings", "auth"), { password: "jin1234" });
        alert('パスワードを「jin1234」にリセットしました。');
      }
    });

    // ログアウト
    document.getElementById('btnLogout').addEventListener('click', () => {
      document.getElementById('adminAuthSection').classList.remove('hidden');
      document.getElementById('adminContentSection').classList.add('hidden');
      document.getElementById('adminPassInput').value = '';
    });

    // 日付プルダウン初期化（友人用 ＆ 仁専用 NG設定用）
    function initDateDropdowns() {
      const selectGuest = document.getElementById('resDateSelect');
      const selectNg = document.getElementById('ngDateSelect');

      selectGuest.innerHTML = '<option value="">-- 日付を選択してください --</option>';
      selectNg.innerHTML = '<option value="">-- 日付を選択してください --</option>';

      const days = ['日', '月', '火', '水', '木', '金', '土'];

      let current = new Date();
      const endDate = new Date(2026, 8, 30); // 2026年9月30日

      while (current <= endDate) {
        const yyyy = current.getFullYear();
        const mm = String(current.getMonth() + 1).padStart(2, '0');
        const dd = String(current.getDate()).padStart(2, '0');
        const dateVal = `${yyyy}-${mm}-${dd}`;
        const dayStr = days[current.getDay()];

        const opt1 = document.createElement('option');
        opt1.value = dateVal;
        opt1.innerText = `${yyyy}/${mm}/${dd} (${dayStr})`;
        selectGuest.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = dateVal;
        opt2.innerText = `${yyyy}/${mm}/${dd} (${dayStr})`;
        selectNg.appendChild(opt2);

        current.setDate(current.getDate() + 1);
      }
    }

    // 人数選択に応じた名前入力欄の動的生成
    const countSelect = document.getElementById('resCountSelect');
    const namesContainer = document.getElementById('visitorNamesContainer');

    function renderVisitorFields() {
      const count = parseInt(countSelect.value);
      namesContainer.innerHTML = '';

      for (let i = 1; i <= count; i++) {
        const field = document.createElement('div');
        field.className = 'visitor-field';
        field.innerHTML = `
          <label>お名前 ${i} ${i === 1 ? '(代表者)' : ''}</label>
          <input type="text" class="visitor-name-input" placeholder="例: 山田 太郎" required>
        `;
        namesContainer.appendChild(field);
      }
    }

    countSelect.addEventListener('change', renderVisitorFields);

    // 日付変更時に時間帯グリッド生成
    document.getElementById('resDateSelect').addEventListener('change', renderTimeGrid);

    function renderTimeGrid() {
      const dateVal = document.getElementById('resDateSelect').value;
      const gridContainer = document.getElementById('timeGridContainer');
      gridContainer.innerHTML = '';
      selectedTime = null;

      if (!dateVal) {
        gridContainer.innerHTML = '<p style="font-size:0.8rem; color:var(--text-sub); text-align:center; grid-column:span 2;">日付を先に選択してください</p>';
        return;
      }

      // 「退院」判定：現在選ばれた日付が、退院日以降かどうかをチェック
      const dischargeNg = ngData.find(n => n.note === '退院');
      if (dischargeNg && dateVal >= dischargeNg.date) {
        gridContainer.innerHTML = `<p style="font-size:0.85rem; color:var(--danger-color); text-align:center; grid-column:span 2; font-weight:bold; padding: 12px; background: rgba(231,76,60,0.1); border-radius:8px;">退院のため、${dischargeNg.date} 以降の面会予約は受け付けておりません。</p>`;
        return;
      }

      const dateObj = new Date(dateVal + "T00:00:00");
      const day = dateObj.getDay();
      const isWeekend = (day === 0 || day === 6);

      const startHour = isWeekend ? 12 : 14;
      const endHour = 20;

      for (let h = startHour; h < endHour; h++) {
        const timeStr = `${String(h).padStart(2, '0')}:00 - ${String(h + 1).padStart(2, '0')}:00`;
        const hourPrefix = `${String(h).padStart(2, '0')}:00`;

        // 予約済み判定
        const isReserved = reservationsData.some(r => r.date === dateVal && (r.time.includes(hourPrefix) || r.time === timeStr));

        // NG判定
        const isNg = ngData.some(n => {
          if (n.date !== dateVal) return false;
          if (!n.startHour) return true;
          return h >= parseInt(n.startHour) && h < parseInt(n.endHour);
        });

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'time-btn';

        if (isReserved || isNg) {
          btn.classList.add('disabled');
          btn.innerText = `${timeStr}\n(× 予約不可)`;
          btn.disabled = true;
        } else {
          btn.innerText = `${timeStr}\n(〇 予約可)`;
          btn.addEventListener('click', () => {
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedTime = timeStr;
          });
        }
        gridContainer.appendChild(btn);
      }
    }

    // 予約送信
    document.getElementById('guestReservationForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const date = document.getElementById('resDateSelect').value;
      if (!date) {
        alert("希望日を選択してください。");
        return;
      }
      if (!selectedTime) {
        alert("希望時間帯を選択してください。");
        return;
      }

      // 名前を配列で取得
      const nameInputs = document.querySelectorAll('.visitor-name-input');
      const visitors = Array.from(nameInputs).map(i => i.value.trim()).filter(v => v.length > 0);
      const count = parseInt(countSelect.value);

      if (visitors.length < count) {
        alert("全員のお名前を入力してください。");
        return;
      }

      const note = document.getElementById('resNote').value;

      try {
        await addDoc(collection(db, "reservations"), {
          visitor: visitors.join("、"),
          visitorsCount: count,
          date, time: selectedTime, note, createdAt: new Date()
        });
        alert("面会予約が完了しました！");
        document.getElementById('guestReservationForm').reset();
        selectedTime = null;
        renderVisitorFields();
        renderTimeGrid();
      } catch (err) {
        alert("予約に失敗しました: " + err.message);
      }
    });

    // 仁専用：NG時間帯の追加
    document.getElementById('ngForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const date = document.getElementById('ngDateSelect').value;
      if (!date) {
        alert("日付を選択してください。");
        return;
      }
      const startHour = document.getElementById('ngStartHour').value;
      const endHour = document.getElementById('ngEndHour').value;
      const note = document.getElementById('ngNoteSelect').value;

      if (parseInt(startHour) >= parseInt(endHour) && note !== '退院') {
        alert("終了時間は開始時間より後の時間を選択してください。");
        return;
      }

      try {
        await addDoc(collection(db, "ng_dates"), {
          date,
          startHour: note === '退院' ? '12' : startHour,
          endHour: note === '退院' ? '20' : endHour,
          note,
          createdAt: new Date()
        });
        document.getElementById('ngForm').reset();
        alert(note === '退院' ? `${date} 以降を退院日として登録しました。` : "NG時間を追加しました。");
      } catch (err) {
        alert("NG設定の追加に失敗しました: " + err.message);
      }
    });

    // 仁専用：ギフト管理
    document.getElementById('giftForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const item = document.getElementById('giftItem').value;
      const from = document.getElementById('giftFrom').value;
      const returnStatus = document.getElementById('giftReturn').value;
      const note = document.getElementById('giftNote').value;

      try {
        await addDoc(collection(db, "gifts"), {
          item, from, returnStatus, note, createdAt: new Date()
        });
        document.getElementById('giftForm').reset();
      } catch (err) {
        alert("記録に失敗しました: " + err.message);
      }
    });

    // リアルタイムデータ同期（予約データ）
    const qReservations = query(collection(db, "reservations"), orderBy("date", "asc"));
    onSnapshot(qReservations, (snapshot) => {
      reservationsData = [];
      const today = new Date().toISOString().split('T')[0];
      const gList = document.getElementById('guestReservationList');
      const aTodayList = document.getElementById('adminTodayReservationList');
      const aAllList = document.getElementById('adminAllReservationList');

      gList.innerHTML = '';
      aTodayList.innerHTML = '';
      aAllList.innerHTML = '';

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const id = docSnap.id;
        data.id = id;
        reservationsData.push(data);

        const countText = data.visitorsCount ? `(${data.visitorsCount}名)` : '';

        // 友人用リスト
        const gItem = document.createElement('div');
        gItem.className = 'list-item';
        gItem.innerHTML = `<div class="list-item-header">📅 ${data.date} ${data.time} <span>[ 予約あり ]</span></div>`;
        gList.appendChild(gItem);

        // 仁用リスト
        const aItem = document.createElement('div');
        aItem.className = 'list-item';
        aItem.innerHTML = `
          <div class="list-item-header">
            <span>📅 ${data.date} ${data.time}</span>
            <span>👤 ${data.visitor} 様 ${countText}</span>
          </div>
          ${data.note ? `<div class="list-item-note">${data.note}</div>` : ''}
          <button class="btn-delete" onclick="deleteData('reservations', '${id}')">削除</button>
        `;

        if (data.date === today) {
          aTodayList.appendChild(aItem.cloneNode(true));
        }
        aAllList.appendChild(aItem);
      });

      if (gList.innerHTML === '') gList.innerHTML = '<p style="font-size:0.8rem; color:var(--text-sub); text-align:center;">予定された面会はありません</p>';
      if (aTodayList.innerHTML === '') aTodayList.innerHTML = '<p style="font-size:0.8rem; color:var(--text-sub); text-align:center;">本日の予約はありません</p>';
      if (aAllList.innerHTML === '') aAllList.innerHTML = '<p style="font-size:0.8rem; color:var(--text-sub); text-align:center;">予約はありません</p>';

      renderTimeGrid();
    });

    // リアルタイムデータ同期（NG設定）
    const qNg = query(collection(db, "ng_dates"), orderBy("date", "asc"));
    onSnapshot(qNg, (snapshot) => {
      ngData = [];
      const aList = document.getElementById('adminNgList');
      aList.innerHTML = '';

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const id = docSnap.id;
        ngData.push(data);

        const timeInfo = data.note === '退院' ? '終日〜以降不可' : (data.startHour ? `${data.startHour}:00〜${data.endHour}:00` : '終日');
        const aItem = document.createElement('div');
        aItem.className = 'list-item ng-item';
        aItem.innerHTML = `
          <div class="list-item-header">⛔ ${data.date} (${timeInfo})</div>
          <div class="list-item-note" style="color: var(--danger-color); font-weight: bold;">【${data.note || '不可'}】</div>
          <button class="btn-delete" onclick="deleteData('ng_dates', '${id}')">削除</button>
        `;
        aList.appendChild(aItem);
      });

      if (aList.innerHTML === '') aList.innerHTML = '<p style="font-size:0.8rem; color:var(--text-sub); text-align:center;">NG登録はありません</p>';

      renderTimeGrid();
    });

    // リアルタイムデータ同期（ギフト）
    const qGifts = query(collection(db, "gifts"), orderBy("createdAt", "desc"));
    onSnapshot(qGifts, (snapshot) => {
      const list = document.getElementById('adminGiftList');
      list.innerHTML = '';

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const id = docSnap.id;
        const item = document.createElement('div');
        item.className = 'list-item';
        item.style.borderLeftColor = 'var(--accent-amber)';
        item.innerHTML = `
          <div class="list-item-header">🎁 ${data.item} <span style="font-size:0.8rem; color:var(--text-sub);">${data.from} 様</span></div>
          <div style="font-size:0.8rem; color:var(--accent-gold); margin-top:4px;">お返し: ${data.returnStatus}</div>
          ${data.note ? `<div class="list-item-note">${data.note}</div>` : ''}
          <button class="btn-delete" onclick="deleteData('gifts', '${id}')">削除</button>
        `;
        list.appendChild(item);
      });

      if (list.innerHTML === '') list.innerHTML = '<p style="font-size:0.8rem; color:var(--text-sub); text-align:center;">記録はありません</p>';
    });

    window.deleteData = async (colName, id) => {
      if (confirm('この項目を削除しますか？')) {
        await deleteDoc(doc(db, colName, id));
      }
    };

    // 初期起動処理
    initDateDropdowns();
    renderVisitorFields();
  </script>
</head>
<body>
  <div class="container">
    <header>
      <h1>仁 面会予約＆管理システム</h1>
      <p>面会スケジュール・差し入れ管理</p>
    </header>

    <!-- タブ切り替え -->
    <div class="nav-tabs">
      <button id="tabGuest" class="tab-btn active">📅 面会予約（友人用）</button>
      <button id="tabAdmin" class="tab-btn">🔒 仁専用ページ</button>
    </div>

    <!-- ================= 1. 友人用予約画面 ================= -->
    <div id="viewGuest">
      <div class="card">
        <div class="card-title">📅 面会予約フォーム</div>
        <form id="guestReservationForm">
          <div class="form-group">
            <label>面会人数</label>
            <select id="resCountSelect">
              <option value="1">1名</option>
              <option value="2">2名</option>
              <option value="3">3名</option>
              <option value="4">4名</option>
              <option value="5">5名</option>
            </select>
          </div>

          <!-- 動的に生成される名前入力エリア -->
          <div id="visitorNamesContainer" class="visitor-input-container"></div>

          <div class="form-group">
            <label>希望日</label>
            <select id="resDateSelect" required>
              <option value="">-- 日付を選択してください --</option>
            </select>
          </div>
          <div class="form-group">
            <label>希望時間帯 (平日: 14〜20時 / 土日祝: 12〜20時)</label>
            <div id="timeGridContainer" class="time-grid">
              <p style="font-size:0.8rem; color:var(--text-sub); text-align:center; grid-column:span 2;">日付を先に選択してください</p>
            </div>
          </div>
          <div class="form-group">
            <label>メモ・連絡事項</label>
            <textarea id="resNote" placeholder="伝言などがあれば入力してください"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">面会を予約する</button>
        </form>
      </div>

      <div class="card">
        <div class="card-title">📋 面会予約状況</div>
        <div id="guestReservationList"></div>
      </div>
    </div>

    <!-- ================= 2. 仁専用管理画面 ================= -->
    <div id="viewAdmin" class="hidden">
      <!-- ログイン画面 -->
      <div id="adminAuthSection" class="card">
        <div class="card-title">🔒 仁専用ログイン</div>
        <p style="font-size: 0.8rem; color: var(--text-sub); margin-bottom: 12px;">初期パスワード: <b style="color: var(--accent-gold);">jin1234</b></p>
        <form id="adminLoginForm">
          <div class="form-group">
            <label>パスワード</label>
            <input type="password" id="adminPassInput" placeholder="パスワードを入力" required>
          </div>
          <div id="adminAuthError" class="error-msg"></div>
          <button type="submit" class="btn btn-primary">ログイン</button>
        </form>
        <button id="btnResetPass" class="btn btn-secondary" style="margin-top: 12px; font-size: 0.8rem;">パスワードを忘れた場合（初期化）</button>
      </div>

      <!-- 仁専用コンテンツ（ログイン後） -->
      <div id="adminContentSection" class="hidden">
        <!-- 本日の予約 -->
        <div class="card">
          <div class="card-title">📌 本日の面会予定</div>
          <div id="adminTodayReservationList"></div>
        </div>

        <!-- 面会不可 (NG) 日時設定 -->
        <div class="card">
          <div class="card-title">⛔ 検査・予定等のNG日時設定</div>
          <form id="ngForm">
            <div class="form-group">
              <label>日付</label>
              <select id="ngDateSelect" required>
                <option value="">-- 日付を選択してください --</option>
              </select>
            </div>
            <div class="form-group">
              <label>理由・項目</label>
              <select id="ngNoteSelect">
                <option value="検査">検査</option>
                <option value="食事">食事</option>
                <option value="入浴">入浴</option>
                <option value="その他">その他</option>
                <option value="退院">退院（これ以降の予約をブロック）</option>
              </select>
            </div>
            <div class="form-group" style="display: flex; gap: 8px;">
              <div style="flex: 1;">
                <label>開始時間</label>
                <select id="ngStartHour">
                  <option value="12">12:00</option>
                  <option value="13">13:00</option>
                  <option value="14">14:00</option>
                  <option value="15">15:00</option>
                  <option value="16">16:00</option>
                  <option value="17">17:00</option>
                  <option value="18">18:00</option>
                  <option value="19">19:00</option>
                </select>
              </div>
              <div style="flex: 1;">
                <label>終了時間</label>
                <select id="ngEndHour">
                  <option value="13">13:00</option>
                  <option value="14">14:00</option>
                  <option value="15">15:00</option>
                  <option value="16">16:00</option>
                  <option value="17">17:00</option>
                  <option value="18">18:00</option>
                  <option value="19">19:00</option>
                  <option value="20">20:00</option>
                </select>
              </div>
            </div>
            <button type="submit" class="btn btn-primary">NG時間を追加</button>
          </form>
          <div style="margin-top: 12px;">
            <div style="font-size:0.85rem; font-weight:600; color:var(--accent-gold); margin-bottom:8px;">登録済みNG枠</div>
            <div id="adminNgList"></div>
          </div>
        </div>

        <!-- 差し入れ・お返し管理 -->
        <div class="card">
          <div class="card-title">🎁 差し入れ・お土産・お返し管理</div>
          <form id="giftForm" style="margin-bottom: 12px;">
            <div class="form-group">
              <label>品名・内容</label>
              <input type="text" id="giftItem" placeholder="例: お茶、タオル" required>
            </div>
            <div class="form-group">
              <label>持参者</label>
              <input type="text" id="giftFrom" placeholder="例: 山田 太郎" required>
            </div>
            <div class="form-group">
              <label>お返し状況</label>
              <select id="giftReturn">
                <option value="未（後で）">未（後で）</option>
                <option value="不要">不要</option>
                <option value="完了">完了</option>
              </select>
            </div>
            <div class="form-group">
              <label>メモ</label>
              <input type="text" id="giftNote" placeholder="メモ">
            </div>
            <button type="submit" class="btn btn-primary">記録を追加</button>
          </form>
          <div id="adminGiftList"></div>
        </div>

        <!-- 全予約管理 -->
        <div class="card">
          <div class="card-title">📋 全ての面会予約一覧</div>
          <div id="adminAllReservationList"></div>
        </div>

        <!-- パスワード設定・ログアウト -->
        <div class="card">
          <div class="card-title">⚙️ パスワード変更</div>
          <form id="changePassForm">
            <div class="form-group">
              <label>新しいパスワード</label>
              <input type="password" id="newPassInput" placeholder="新しいパスワード" required>
            </div>
            <button type="submit" class="btn btn-secondary">パスワードを変更する</button>
          </form>
        </div>

        <button id="btnLogout" class="btn btn-danger">ログアウト</button>
      </div>
    </div>
  </div>
</body>
</html>
